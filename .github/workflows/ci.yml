name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: example
          args: --config=../.golangci.yml

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: Test
        shell: bash
        run: go test -race ./... 2>&1 | tee test.log
      - name: Test annotations
        if: failure()
        shell: bash
        run: |
          tail -n 40 test.log | while IFS= read -r line; do
            echo "::error title=go test::$line"
          done
      - name: Coverage
        if: runner.os == 'Linux'
        run: go test -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -1
      - name: Example
        run: cd example && go vet ./... && go build ./...

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
